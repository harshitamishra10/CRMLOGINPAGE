<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Vivid Neon Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#05d9e8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Container (Optional) -->
  <rect width="100%" height="100%" fill="#09090b" rx="16" />

  <!-- LOGO MARK -->
  <g transform="translate(30, 20)" filter="url(#neonGlow)">
    <!-- Outer Mesh Ring -->
    <circle cx="40" cy="40" r="32" fill="none" stroke="url(#neonGradient)" stroke-width="4" stroke-dasharray="80 20" />
    
    <!-- Central Connected Nexus Hub -->
    <path d="M 28 40 L 52 40 M 40 28 L 40 52" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="40" cy="40" r="6" fill="#ff2a6d" />
    <circle cx="40" cy="40" r="3" fill="#ffffff" />

    <!-- Satellite Nodes -->
    <circle cx="28" cy="40" r="3" fill="#05d9e8" />
    <circle cx="52" cy="40" r="3" fill="#05d9e8" />
    <circle cx="40" cy="28" r="3" fill="#05d9e8" />
    <circle cx="40" cy="52" r="3" fill="#05d9e8" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(130, 68)">
    <text font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="0">
      <tspan fill="#ffffff">Chat</tspan>
      <tspan fill="url(#neonGradient)">Nexus</tspan>
    </text>
    <text y="18" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#52525b" 
          text-transform="uppercase">
      TERMINAL ENGINE
    </text>
  </g>
</svg>
